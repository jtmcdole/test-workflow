name: Test workflow 

on:
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: jtmcdole/setup-flutter@e04da71b3fd4854c37681c06cf6def737eddd819

      - name: Checkout code
        uses: actions/checkout@v4

      - name: tests
        run: |
          flutter --version
          flutter docotor


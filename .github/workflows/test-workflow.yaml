name: Test workflow 

on:
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: jtmcdole/setup-flutter@d868be1c3f142595f6aa55e471f615813a210793

      - name: Checkout code
        uses: actions/checkout@v4

      - name: tests
        run: |
          flutter --version
          flutter doctor

